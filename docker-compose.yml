services:
  bot:
    build: .
    env_file:
      - path: .env
        required: false
    depends_on:
      - redis
      - minio
    ports:
      - "127.0.0.1:18087:8080"
    volumes:
      - sqlite-data:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-wrnrs}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me-in-production}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  sqlite-data:
  redis-data:
  minio-data:
